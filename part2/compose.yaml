services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: lab-queue:latest
    environment:
      PORT: "8000"
      DATA_DIR: /data
    volumes:
      - queue-data:/data
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  queue-data: