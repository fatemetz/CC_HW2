services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: lab_queue
      POSTGRES_USER: queue_user
      POSTGRES_PASSWORD: queue_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queue_user -d lab_queue"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    image: lab-queue-postgres:latest
    environment:
      PORT: "8000"
      DATA_DIR: /data
      QUEUE_BACKEND: postgres
      DATABASE_URL: postgresql://queue_user:queue_password@db:5432/lab_queue
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-data: