
name: CI and Publish

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: part2/Dockerfile
          failure-threshold: error

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Lint Python application
        run: ruff check app/
        working-directory: part2

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: part2

      - name: Run tests
        run: python -m pytest -q
        working-directory: part2

  build:
    name: build
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build queue image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ./part2
          file: ./part2/Dockerfile
          push: false

  push:
    name: push
    needs: [lint, test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate version
        id: version
        shell: bash
        run: |
          VERSION="v$(git show -s --format=%cs "$GITHUB_SHA")-${GITHUB_SHA::7}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push queue image
        uses: docker/build-push-action@v6
        with:
          context: ./part2
          file: ./part2/Dockerfile
          push: true
          tags: |
            ghcr.io/fatemetz/lab-queue:${{ steps.version.outputs.value }}
            ghcr.io/fatemetz/lab-queue:latest

  pages:
    name: pages
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate version
        id: version
        shell: bash
        run: |
          VERSION="v$(git show -s --format=%cs "$GITHUB_SHA")-${GITHUB_SHA::7}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Insert version into website
        run: |
          sed -i "s/__VERSION__/${{ steps.version.outputs.value }}/g" part2/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: part2/site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  tag:
    name: tag
    needs: [push, pages]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push annotated tag
        shell: bash
        run: |
          VERSION="v$(git show -s --format=%cs "$GITHUB_SHA")-${GITHUB_SHA::7}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            EXISTING_COMMIT=$(git rev-list -n 1 "$VERSION")

            if [ "$EXISTING_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $VERSION already exists on another commit."
              exit 1
            fi

            echo "Tag $VERSION already exists on this commit."
          else
            git tag -a "$VERSION" "$GITHUB_SHA" -m "Release $VERSION for commit $GITHUB_SHA"
            git push origin "$VERSION"
          fi
