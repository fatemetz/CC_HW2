
name: Manual Pages Deployment

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (for example: v2026-11-19-ab12cd3)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify selected tag
        env:
          SELECTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$SELECTED_TAG" =~ ^v[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{7}$ ]]; then
            echo "Invalid tag format."
            exit 1
          fi

          if ! git rev-parse --verify "refs/tags/$SELECTED_TAG" >/dev/null 2>&1; then
            echo "Tag $SELECTED_TAG does not exist."
            exit 1
          fi

          CHECKED_OUT_COMMIT=$(git rev-parse HEAD)
          TAG_COMMIT=$(git rev-list -n 1 "$SELECTED_TAG")

          if [ "$CHECKED_OUT_COMMIT" != "$TAG_COMMIT" ]; then
            echo "Checked out commit does not match the selected tag."
            exit 1
          fi

          echo "Deploying tag $SELECTED_TAG from commit $CHECKED_OUT_COMMIT"

      - name: Insert selected version into website
        env:
          SELECTED_TAG: ${{ inputs.tag }}
        run: |
          if ! grep -q '__VERSION__' part2/site/index.html; then
            echo "Version placeholder was not found."
            exit 1
          fi

          sed -i "s/__VERSION__/$SELECTED_TAG/g" part2/site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: part2/site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
